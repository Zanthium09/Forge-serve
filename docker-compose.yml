services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      WORKER_URLS: http://worker1:9000,http://worker2:9000
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
      REDIS_URL: redis://redis:6379
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started

  # Two workers so routing and failover are real. They are not published to
  # the host: the gateway is the only public door.
  worker1: &worker
    build: ./worker
    volumes:
      - ./models:/models:ro
    environment:
      MODEL_PATH: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      # ENGINE=sequential docker compose up -d worker1 worker2 -> baseline
      ENGINE: ${ENGINE:-batched}
      MAX_BATCH: ${MAX_BATCH:-16}
      MAX_QUEUE: ${MAX_QUEUE:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker2: *worker

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # Local demo only: anonymous read-only viewing so the dashboard is
      # one click from the README, with no login to document.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
