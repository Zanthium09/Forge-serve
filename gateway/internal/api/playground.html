<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge-Serve playground</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#e8eaed; --mut:#9aa0a6;
          --acc:#7f77dd; --card:#171a21; --line:#2a2f3a; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f7f8; --fg:#1a1a1a; --mut:#5f6368; --card:#fff; --line:#e3e5e8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--mut); font-size: 14px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:6px; }
  input, textarea, select {
    width:100%; padding:10px 12px; background:transparent; color:var(--fg);
    border:1px solid var(--line); border-radius:8px; font:inherit; font-size:14px;
  }
  textarea { min-height:88px; resize:vertical; }
  .row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--acc);
           color:#fff; font:inherit; font-weight:500; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #out { margin-top:16px; white-space:pre-wrap; min-height:96px;
         border-top:1px solid var(--line); padding-top:16px; }
  .stats { display:flex; gap:20px; margin-top:14px; font-size:13px; color:var(--mut);
           border-top:1px solid var(--line); padding-top:12px; flex-wrap:wrap; }
  .stats b { color:var(--fg); font-weight:500; }
  code { background:rgba(127,119,221,.14); padding:1px 6px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Forge-Serve playground</h1>
  <div class="sub">Streaming from a self-hosted Qwen2.5-1.5B through the OpenAI-compatible gateway.</div>

  <div class="card">
    <div class="row">
      <div>
        <label for="key">API key</label>
        <input id="key" value="sk-forge-dev-key" spellcheck="false">
      </div>
      <div>
        <label for="max">Max tokens</label>
        <input id="max" type="number" value="120" min="1" max="1024">
      </div>
      <div>
        <label for="temp">Temperature</label>
        <input id="temp" type="number" value="0.7" min="0" max="2" step="0.1">
      </div>
    </div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt">Explain continuous batching in LLM serving, in three sentences.</textarea>
    <div style="margin-top:12px"><button id="go">Send</button></div>
    <div id="out"></div>
    <div class="stats">
      <span>TTFT <b id="ttft">–</b></span>
      <span>tokens <b id="ntok">–</b></span>
      <span>tok/s <b id="tps">–</b></span>
    </div>
  </div>

  <p class="sub" style="margin-top:24px">
    Same API as OpenAI — point any client at <code>/v1</code> and it works unmodified.
  </p>
</div>

<script>
const $ = id => document.getElementById(id);

$('go').onclick = async () => {
  const btn = $('go'), out = $('out');
  btn.disabled = true;
  out.textContent = '';
  $('ttft').textContent = $('ntok').textContent = $('tps').textContent = '–';

  const started = performance.now();
  let first = null, tokens = 0;

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': 'Bearer ' + $('key').value },
      body: JSON.stringify({
        model: 'qwen2.5-1.5b',
        stream: true,
        max_tokens: Number($('max').value),
        temperature: Number($('temp').value),
        messages: [{ role: 'user', content: $('prompt').value }]
      })
    });

    if (!resp.ok) {
      out.textContent = 'HTTP ' + resp.status + ': ' + (await resp.text());
      btn.disabled = false;
      return;
    }

    // Parse the SSE stream by hand: one `data: ` line per token.
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') continue;
        let obj;
        try { obj = JSON.parse(payload); } catch { continue; }
        if (obj.error) { out.textContent += '\n[' + obj.error.message + ']'; continue; }
        const piece = obj.choices?.[0]?.delta?.content;
        if (!piece) continue;
        if (first === null) {
          first = performance.now() - started;
          $('ttft').textContent = Math.round(first) + ' ms';
        }
        tokens++;
        out.textContent += piece;
        $('ntok').textContent = tokens;
        const secs = (performance.now() - started) / 1000;
        $('tps').textContent = (tokens / secs).toFixed(1);
      }
    }
  } catch (e) {
    out.textContent += '\n[connection error: ' + e.message + ']';
  }
  btn.disabled = false;
};
</script>
</body>
</html>
