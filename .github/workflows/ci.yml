name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false # no go.sum yet (zero deps); enable when deps appear
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: gateway
      - name: Unit tests
        run: go test ./...
        working-directory: gateway
