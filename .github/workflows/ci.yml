name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    # Real Postgres/Redis for store migrations, identity queries and the Lua
    # scripts; tests skip when the URLs are unset (local runs without Docker).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 2s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      FORGE_TEST_DATABASE_URL: postgres://forge:forge@localhost:5432/forge?sslmode=disable
      FORGE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: gateway/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: gateway
      - name: Unit tests
        run: go test ./...
        working-directory: gateway

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff)
        run: |
          pip install ruff==0.17.5  # pinned: new releases add rules and break CI on unchanged code
          ruff check worker/

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scheduler tests only - they use a fake model backend, so CI never
      # installs llama-cpp-python or loads a model.
      - name: Scheduler unit tests
        run: |
          pip install pytest
          python -m pytest worker/tests -q
